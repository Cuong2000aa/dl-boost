<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseDM</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="22" height="22" />
        <span>PulseDM</span>
      </div>
      <div class="top-links">
        <button id="openManager" class="linkish" type="button">Manager</button>
        <button id="openOptions" class="linkish" type="button">Cài đặt</button>
      </div>
    </header>

    <form id="addForm" class="add">
      <input
        id="urlInput"
        type="url"
        placeholder="Dán URL tệp để tải…"
        autocomplete="off"
        required
      />
      <button type="submit" id="addBtn">Tải</button>
    </form>

    <div class="quick">
      <button type="button" id="batchBtn" class="chip">Batch URL</button>
      <button type="button" id="pasteBtn" class="chip">Dán & tải</button>
    </div>

    <div id="stats" class="stats">
      <span id="statActive">0 đang tải</span>
      <span id="statSpeed">0 B/s</span>
    </div>

    <ul id="list" class="list" aria-live="polite"></ul>
    <p id="empty" class="empty">Chưa có tải xuống. Dán URL, Alt+click, hoặc Ctrl+Shift+Y trên trang.</p>

    <footer class="foot">
      <label class="toggle">
        <input type="checkbox" id="captureToggle" />
        Bắt tải của trình duyệt
      </label>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
